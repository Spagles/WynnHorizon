name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Voxy 0.2.16-beta's published jar ships class files built with a
      # newer JDK than Minecraft 1.21.11/Loom actually require (class file
      # version 69 = Java 25). javac can never read a class file newer than
      # its own JDK, regardless of --release, so the JDK running the build
      # must be new enough to read that dependency - hence 25 here even
      # though build.gradle's `options.release = 21` still makes our own
      # compiled output target Java 21 for players.
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: temurin

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wynnhorizon
          path: build/libs/*.jar
          if-no-files-found: error
