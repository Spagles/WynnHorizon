# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G

org.gradle.caching=true
org.gradle.parallel=true

# Fabric Properties
# Pinned to whatever Minecraft version Wynncraft actually runs (currently
# 1.21.11), NOT Voxy's latest supported version - check
# https://modrinth.com/mod/voxy/versions for the currently correct values
# if Wynncraft's server version ever changes.
minecraft_version=1.21.11
loader_version=0.19.3
# Pinned older than the 1.16.x+ line on purpose: 1.16 split the Loom plugin
# into 'fabric-loom' (full remap) vs 'net.fabricmc.fabric-loom' (no-remap
# marker), and its access-widener merging for mod dependencies doesn't
# handle Voxy's official-namespace-only accesswidener (mixed with
# intermediary-namespace Fabric API modules) correctly for this genuinely
# obfuscated MC version. 1.15.5 is the last pre-split stable release and
# builds this project correctly - verified directly, not assumed.
loom_version=1.15.5

fabric_api_version=0.141.6+1.21.11

# The exact Voxy release this mod is built/tested against (Modrinth version number).
# See DEVELOPING.md "Versions this is built/tested against" if this ever needs to change.
voxy_version=0.2.16-beta

# Soft/optional dependencies for the in-game config screen (see
# ModMenuIntegration) - both normal, well-formed Fabric mods (unlike Voxy),
# so no compileOnly/accessWidener workaround needed.
modmenu_version=17.0.0
cloth_config_version=21.11.153+fabric

# Mod Properties
mod_version=1.0.0
maven_group=dev.wynnhorizon
archives_base_name=wynnhorizon
